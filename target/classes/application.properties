spring.application.name=LibraryManagementSystem

# ===============================
# Server Configuration
# ===============================
server.port=${PORT:8080}

# ===============================
# PostgreSQL Configuration
# (values come from environment variables set on Render; local fallback
#  defaults kept after the colon so it still runs on your machine)
# ===============================
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/lib_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=org.postgresql.Driver

# Neon free tier puts the DB to sleep when idle; this makes the pool
# tolerate the reconnect instead of throwing errors on the first request
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=5

# ===============================
# JPA / Hibernate Configuration
# (ddl-auto=none -> tables are created manually via src/main/resources/db/init.sql,
#  same convention as the original reference project)
# ===============================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ===============================
# Pagination default (used by AbstractJpaDao.getPageLimit())
# ===============================
PAGE_LIMIT=10

# ===============================
# JWT Config (equivalent of Node's jwt.sign(..., "SECRET_KEY", { expiresIn: "7d" }))
# ===============================
jwt.secret=${JWT_SECRET:CHANGE_THIS_TO_A_LONG_RANDOM_SECRET_KEY_MIN_32_CHARS}
jwt.expiration-ms=604800000

# ===============================
# File upload (equivalent of multer, replacing multer-storage-cloudinary
# with local disk storage - swap in a Cloudinary/S3 uploader for production)
# ===============================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=5MB
file.upload-dir=uploads

# ===============================
# Razorpay Config (equivalent of process.env.RAZORPAY_KEY_ID / KEY_SECRET)
# ===============================
razorpay.key-id=${RAZORPAY_KEY_ID:rzp_live_TGashPHzNIrn23}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:SNZ4HZrKpqVg4RFGEiyKtn14}

# ===============================
# Logging
# ===============================
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=DEBUG
